@for (option of options; track option.id) {
  <label class="me-1" [for]="option.name">{{ option.name }}</label>
  <input class="me-3" type="checkbox"
         [id]="option.name"
         [checked]="isChecked(option.id)"
         [value]="option.id"
         (change)="onCheckboxChange($event)">
}
