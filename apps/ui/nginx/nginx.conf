pid /tmp/nginx.pid;

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
   include /etc/nginx/mime.types;
   default_type application/octet-stream;
   sendfile on;
   tcp_nopush on;
   keepalive_timeout 30;
   gzip on;
   server_tokens off;


  upstream das_data {
    # Reference the container name and port
    server das_webapi:3000 weight=1;
  }


  server {
        listen 80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/das-webapi/ {
          rewrite  ^/api/das-webapi/(.*)$ /das-api/$1 break;
          proxy_pass http://das_data; # Match upstream name, rather than container name "das_webapi"
          proxy_set_header Host $host; # Maintain host headers
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Real-IP $remote_addr;
          # Optional if upstream returns redirects
          proxy_redirect off;
          proxy_set_header Host $host;
        }
  }

}
